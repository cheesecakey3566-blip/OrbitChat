<script>
const API_BASE=window.ORBIT_API_BASE||"https://3000-iln5w0ns0p0yjq31bc6s6-31ca76dd.us1.manus.computer";
const state={user:null,communities:[],publicCommunities:[],channels:[],members:[],friends:[],incomingRequests:[],outgoingRequests:[],messages:[],activeCommunityId:null,activeChannelId:null,activeDmUserId:null,dmFriend:null,dmMessages:[],groups:[],activeGroupId:null,group:null,groupMessages:[],serverOverview:null,view:"server",authMode:"login",search:"",replyToId:null,realtimeSource:null,pollTimer:null,call:{joined:false,channelId:null,kind:null,localStream:null,peers:new Map(),signalId:0,pollTimer:null}};
const app=document.querySelector("#app");const toast=document.querySelector("#toast");
const api=async(path,options={})=>{const response=await fetch(`${API_BASE}${path}`,{credentials:"include",headers:{"Content-Type":"application/json",...(options.headers||{})},...options});let data={};try{data=await response.json()}catch{}if(!response.ok)throw new Error(data.error||"Something went wrong");return data};
const assetUrl=url=>url&&url.startsWith("/")?`${API_BASE}${url}`:url;
const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
const initials=value=>(String(value||"?").split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("")||"?").toUpperCase();
const showToast=message=>{toast.textContent=message;toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),2200)};
function avatar(name,image){return `<span class="avatar" ${image?`style="background-image:url('${esc(image)}');background-size:cover;background-position:center;color:transparent"`:""}>${esc(initials(name))}<i class="online"></i></span>`}
function renderAuth(){app.innerHTML=`<main class="auth-screen"><section class="auth-card"><div class="brand"><div class="brand-mark">✦</div><div><h1>Orbit Chat</h1><p>Private communities, real people</p></div></div><h2>${state.authMode==="login"?"Welcome back":"Create your account"}</h2><p class="intro">${state.authMode==="login"?"Sign in with your username or email and password.":"Create a normal Orbit account. No Google login, no external OAuth."}</p><div class="auth-tabs"><button class="${state.authMode==="login"?"active":""}" data-auth="login">Sign in</button><button class="${state.authMode==="register"?"active":""}" data-auth="register">Create account</button></div><form id="auth-form">${state.authMode==="register"?`<label class="field"><span>USERNAME</span><input name="username" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_]+" required placeholder="orbit_user"></label><label class="field"><span>EMAIL</span><input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></label>`:`<label class="field"><span>USERNAME OR EMAIL</span><input name="identifier" autocomplete="username" required placeholder="orbit_user or you@example.com"></label>`}<label class="field"><span>PASSWORD</span><input name="password" type="password" autocomplete="${state.authMode==="login"?"current-password":"new-password"}" minlength="8" required placeholder="At least 8 characters"></label><div id="form-error" class="form-error"></div><button class="primary" type="submit">${state.authMode==="login"?"Sign in":"Create account"}</button></form><p class="auth-note">Your account is stored by Orbit Chat. Passwords are hashed on the server and never shown in the app.</p></section></main>`;document.querySelectorAll("[data-auth]").forEach(button=>button.onclick=()=>{state.authMode=button.dataset.auth;renderAuth()});document.querySelector("#auth-form").onsubmit=handleAuth}
async function handleAuth(event){event.preventDefault();const form=new FormData(event.currentTarget);const body=Object.fromEntries(form.entries());const error=document.querySelector("#form-error");error.textContent="";const submit=event.currentTarget.querySelector("button[type=submit]");submit.disabled=true;submit.textContent="Working…";try{const result=await api(`/api/web/auth/${state.authMode}`,{method:"POST",body:JSON.stringify(body)});state.user=result.user;await loadHome()}catch(err){error.textContent=err.message;submit.disabled=false;submit.textContent=state.authMode==="login"?"Sign in":"Create account"}}
async function boot(){try{const result=await api("/api/web/auth/me");state.user=result.user;await loadHome();await handleInviteFromUrl()}catch{renderAuth()}}
function startRealtime(){if(state.realtimeSource||!window.EventSource||!state.user)return;const source=new EventSource(`${API_BASE}/api/web/events`,{withCredentials:true});source.onmessage=event=>{try{const data=JSON.parse(event.data);if(data.type==="ready"||document.activeElement?.classList.contains("message-input"))return;if(data.type==="dm"&&state.view==="dm"&&state.activeDmUserId)loadDm(state.activeDmUserId);else if((data.type==="message"||data.type==="poll")&&state.view==="server"&&state.activeChannelId)loadHome(state.activeChannelId);else if(data.type==="group"&&state.view==="group"&&state.activeGroupId)loadGroup(state.activeGroupId)}catch{}};source.onerror=()=>{source.close();state.realtimeSource=null}}
function startPolling(){clearInterval(state.pollTimer);startRealtime();if(state.call.joined)return;state.pollTimer=setInterval(()=>{if(!state.user||document.activeElement?.classList.contains("message-input"))return;if(state.view==="dm"&&state.activeDmUserId)loadDm(state.activeDmUserId);else if(state.view!=="discover")loadHome(state.activeChannelId)},5000)}
async function loadHome(channelId){try{const groups=await api("/api/web/groups");state.groups=groups.groups||[]}catch{} const query=channelId?`?channelId=${channelId}`:"";try{const result=await api(`/api/web/home${query}`);Object.assign(state,result);if(!state.activeCommunityId&&state.communities[0])state.activeCommunityId=state.communities[0].id;if(!state.activeChannelId){const first=state.channels.find(c=>c.communityId===state.activeCommunityId);state.activeChannelId=first?.id||null}if(channelId)state.activeChannelId=channelId;if(state.view==="dm")state.view="server";renderApp();startPolling()}catch(err){showToast(err.message)}}
async function loadDiscover(){try{const result=await api("/api/web/discover");state.publicCommunities=result.communities||[];state.view="discover";renderApp();startPolling()}catch(err){showToast(err.message)}}
async function loadDm(friendId){try{const result=await api(`/api/web/dm?friendId=${friendId}`);state.activeDmUserId=Number(friendId);state.dmFriend=result.friend;state.dmMessages=result.messages;state.view="dm";renderApp();startPolling()}catch(err){showToast(err.message)}}
async function loadGroup(groupId){try{const result=await api(`/api/web/groups/${groupId}`);state.activeGroupId=Number(groupId);state.group=result.group;state.groupMessages=result.messages||[];state.view="group";renderApp();startPolling()}catch(err){showToast(err.message)}}
function renderApp(){const community=state.communities.find(c=>c.id===state.activeCommunityId);const channels=state.channels.filter(c=>c.communityId===state.activeCommunityId);const channel=channels.find(c=>c.id===state.activeChannelId)||channels[0];if(channel&&!state.activeChannelId)state.activeChannelId=channel.id;app.innerHTML=`<div class="app"><aside class="rail"><button class="orbit-logo" data-home>✦</button><div class="rail-rule"></div>${state.communities.map(c=>`<button class="rail-button ${c.id===state.activeCommunityId&&state.view==="server"?"active":""}" data-community="${c.id}" title="${esc(c.name)}">${esc(initials(c.name).slice(0,2))}</button>`).join("")}<button class="rail-button add" data-create-community title="Create community">+</button><div class="rail-bottom"><button class="rail-button" data-logout title="Log out">↪</button></div></aside><aside class="workspace"><div class="workspace-head"><div><div>${state.view==="dm"||state.view==="group"?"Direct messages":state.view==="friends"?"Friends":state.view==="discover"?"Discover":community?esc(community.name):"Your communities"}</div><small>${esc(state.user.username)} · signed in</small></div><button class="workspace-action" data-server-menu title="Server menu">☰</button><button class="workspace-action" data-create-community title="Create server">＋</button></div><div class="channel-area">${state.view==="server"?renderChannelSidebar(community,channels):state.view==="friends"?renderFriendSidebar():state.view==="discover"?renderDiscoverSidebar():renderDmSidebar()}</div></aside><main class="main">${renderTopbar(channel,community)}${state.view==="server"?renderServerBody(channel,community):state.view==="friends"?renderFriendsBody():state.view==="discover"?renderDiscoverBody():state.view==="dm"?renderDmBody():state.view==="group"?renderGroupBody():renderDmListBody()}${renderBottom()}</main></div>`;bindAppEvents()}
function renderChannelSidebar(community,channels){return community?`<div class="section-title">TEXT CHANNELS <button class="channel-add" data-create-channel>＋</button></div>${channels.filter(c=>c.kind==="text").map(channelButton).join("")}<div class="section-title" style="margin-top:22px">VOICE CHANNELS</div>${channels.filter(c=>c.kind==="voice").map(channelButton).join("")||`<div style="padding:8px;color:var(--dim);font-size:11px">No voice channels yet</div>`}`:`<div class="empty"><div class="empty-inner"><div class="intro-icon">＋</div><h2>No community yet</h2><p>Create a community to start chatting with real members.</p><button class="primary" data-create-community>Create your community</button></div></div>`}
function renderDmSidebar(){return `<div class="section-title">DIRECT MESSAGES <button class="channel-add" data-add-friend>＋</button></div><button class="channel" data-create-group><span class="channel-icon">✚</span>New group DM</button>${state.groups.map(group=>`<button class="channel ${state.activeGroupId===group.id?"active":""}" data-group="${group.id}"><span class="channel-icon">◉</span>${esc(group.name)}</button>`).join("")}${state.friends.map(friend=>`<button class="channel ${state.activeDmUserId===friend.userId?"active":""}" data-dm="${friend.userId}"><span class="channel-icon">●</span>${esc(friend.name||friend.email||"Orbit user")}</button>`).join("")||`<div style="padding:8px;color:var(--dim);font-size:11px">No accepted friends yet</div>`}<button class="channel" data-nav="friends"><span class="channel-icon">♙</span>Friend requests</button>`}
function renderDiscoverSidebar(){return `<div class="section-title">PUBLIC COMMUNITIES</div><div style="padding:8px;color:var(--dim);font-size:11px">${state.publicCommunities.length} communities available to everyone</div><button class="channel active" data-nav="discover"><span class="channel-icon">✦</span>Browse servers</button><button class="channel" data-nav="friends"><span class="channel-icon">♙</span>Friends</button>`}
function renderFriendSidebar(){return `<div class="section-title">FRIEND CENTER</div><button class="channel active" data-nav="friends"><span class="channel-icon">♙</span>All friends</button><button class="channel" data-add-friend><span class="channel-icon">＋</span>Add a friend</button><div class="section-title" style="margin-top:22px">PENDING</div><div style="padding:8px;color:var(--dim);font-size:11px">${state.incomingRequests.length} incoming · ${state.outgoingRequests.length} outgoing</div>`}
function channelButton(channel){return `<button class="channel ${channel.id===state.activeChannelId?"active":""}" data-channel="${channel.id}"><span class="channel-icon">${channel.kind==="voice"?"◖":"#"}</span>${esc(channel.name)}</button>`}
function renderTopbar(channel,community){const title=state.view==="dm"?(state.dmFriend?.name||state.dmFriend?.email||"Direct message"):state.view==="friends"?"Friends":state.view==="dm-list"?"Direct messages":channel?channel.name:community?community.name:"Orbit Chat";return `<header class="topbar"><div class="topbar-title"><button class="icon-button mobile-menu" data-toggle-workspace>☰</button><span class="hash">${state.view==="dm"?"●":state.view==="server"?(channel?(channel.kind==="voice"?"◖":"#"):"✦"):"♙"}</span><strong>${esc(title)}</strong></div><div class="top-actions"><button class="icon-button" data-refresh title="Refresh">↻</button>${state.view==="server"&&community?`<button class="icon-button" data-server-menu title="Server menu">☰</button><button class="icon-button" data-members title="Members">♙</button><button class="icon-button" data-share-community="${community.id}" title="Invite people">↗</button>`:""}<button class="profile-trigger" data-profile>${avatar(state.user.username,state.user.avatarUrl)}<span>${esc(state.user.presence||"online")}</span></button></div></header>`}
function renderServerBody(channel,community){return channel?(channel.kind==="voice"?renderCallBody(channel):renderChat(channel)):`<div class="empty"><div class="empty-inner"><div class="intro-icon">✦</div><h2>Your Orbit starts here</h2><p>No demo users or sample messages are loaded. Create a real community to begin.</p><button class="primary" data-create-community>Create community</button></div></div>`}
function renderCallBody(channel){const joined=state.call.joined&&state.call.channelId===channel.id;return `<section class="call-screen"><div class="call-hero"><div class="intro-icon">◖</div><h2>${esc(channel.name)}</h2><p>${joined?"You are connected. Your browser is handling the peer-to-peer media stream.":"Join this voice channel to talk with community members."}</p>${joined?`<div class="call-media"><div class="local-tile"><video id="local-video" autoplay muted playsinline></video><span>You</span></div><div id="remote-media" class="remote-media"></div></div><div class="call-controls"><button class="icon-button" data-toggle-mic>Mute</button>${state.call.kind==="video"?`<button class="icon-button" data-toggle-camera>Camera</button>`:""}<button class="danger-button" data-leave-call>Leave</button></div>`:`<div class="call-controls"><button class="primary" data-join-call data-kind="voice">Join with microphone</button><button class="primary" data-join-call data-kind="video">Join with camera</button></div>`}</div></section>`}
function renderChat(channel){const visible=state.messages.filter(m=>!state.search||String(m.body||"").toLowerCase().includes(state.search.toLowerCase()));return `<section class="messages" id="messages"><div class="intro"><div class="intro-icon">${channel.kind==="voice"?"◖":"#"}</div><h2>Welcome to #${esc(channel.name)}</h2><p>This is the beginning of the channel. Only real members and messages appear here.</p></div>${visible.length?visible.map(m=>`<article class="message ${m.isPinned?"pinned":""}">${avatar(m.authorName||m.authorEmail,m.authorAvatarUrl)}<div class="message-body"><div class="message-meta"><strong>${esc(m.authorName||m.authorEmail||"Orbit user")}</strong><time>${new Date(m.createdAt).toLocaleString()}${m.editedAt?" · edited":""}</time>${m.isPinned?"<span class=pin-label>pinned</span>":""}</div>${m.replyToId?`<div class="reply-context">↪ Replying to message #${m.replyToId}</div>`:""}<p>${esc(m.body)}</p>${m.attachmentUrl?renderAttachment(m):""}${renderPoll(m)}<div class="message-actions"><button class="reaction-add" data-reaction="${m.id}">＋ React</button><button data-reply="${m.id}">Reply</button>${Object.entries(m.reactions||{}).map(([emoji,reaction])=>`<button class="reaction ${reaction.reacted?"active":""}" data-toggle-reaction="${m.id}" data-emoji="${esc(emoji)}">${esc(emoji)} <b>${reaction.count}</b></button>`).join("")} ${m.authorId===state.user.id?`<button data-edit-message="${m.id}">Edit</button><button class="message-delete" data-delete-message="${m.id}">Delete</button>`:""}<button data-pin-message="${m.id}">${m.isPinned?"Unpin":"Pin"}</button></div></div></article>`).join(""):`<div class="empty" style="min-height:210px"><div class="empty-inner"><h2>No messages yet</h2><p>Start the first conversation in this real channel.</p></div></div>`}</section><div class="composer-wrap"><form class="composer" id="message-form"><button type="button" data-attach title="Photos, videos, GIFs, or audio">＋</button><button type="button" data-create-poll title="Create a poll">▣</button><input class="message-input" name="body" maxlength="4000" autocomplete="off" placeholder="${state.replyToId?"Reply to":"Message"} #${esc(channel.name)}"><input id="attachment-input" type="file" accept="image/*,video/*,audio/*,.gif" hidden><button class="send" type="submit">↑</button></form><div class="helper">Photos, videos, GIFs, and audio up to 35 MB each. You can share as many as your storage allows.</div></div>`}
function renderDiscoverBody(){return `<section class="messages"><div class="intro"><div class="intro-icon">✦</div><h2>Discover public communities</h2><p>Every Orbit user can browse these servers and join with one tap.</p></div><div class="public-grid">${state.publicCommunities.length?state.publicCommunities.map(c=>`<article class="public-card"><div class="public-card-mark">${esc(initials(c.name).slice(0,2))}</div><div class="public-card-copy"><h3>${esc(c.name)}</h3><p>${c.memberCount} member${c.memberCount===1?"":"s"} · public server</p></div><button class="primary public-join" data-join-public="${c.id}" ${c.joined?"disabled":""}>${c.joined?"Joined":"Join server"}</button><button class="invite-link-button" data-share-community="${c.id}">Share invite</button></article>`).join(""):`<div class="empty" style="min-height:260px"><div class="empty-inner"><h2>No public communities yet</h2><p>Create the first server and it will appear here for every user.</p></div></div>`}</div></section>`}
function renderDmListBody(){return `<section class="messages"><div class="intro"><div class="intro-icon">●</div><h2>Your direct messages</h2><p>Private conversations are available with accepted friends only.</p></div>${state.friends.length?`<div class="dm-list">${state.friends.map(friend=>`<div class="dm-row-wrap"><button class="dm-row" data-dm="${friend.userId}">${avatar(friend.name||friend.email)}<span><strong>${esc(friend.name||friend.email||"Orbit user")}</strong><small>Open conversation</small></span><b>›</b></button><button class="call-friend" data-call-friend="${friend.userId}" data-kind="voice" title="Voice call">☎</button><button class="call-friend video-call" data-call-friend="${friend.userId}" data-kind="video" title="Video call">▣</button></div>`).join("")}</div>`:`<div class="empty" style="min-height:260px"><div class="empty-inner"><h2>No direct messages yet</h2><p>Accept a friend request, then start a private conversation.</p><button class="primary" data-add-friend>Add a friend</button></div></div>`}</section>`}
function renderDmBody(){if(state.call.joined&&state.call.channelId<0)return `<section class="call-screen"><div class="call-hero"><div class="intro-icon">☎</div><h2>Call with ${esc(state.dmFriend?.name||"friend")}</h2><p>Peer-to-peer ${state.call.kind==="video"?"video":"voice"} call in progress.</p><div class="call-media"><div class="local-tile"><video id="local-video" autoplay muted playsinline></video><span>You</span></div><div id="remote-media" class="remote-media"></div></div><div class="call-controls"><button class="icon-button" data-toggle-mic>Mute</button>${state.call.kind==="video"?`<button class="icon-button" data-toggle-camera>Camera</button>`:""}<button class="danger-button" data-leave-call>Leave call</button></div></div></section>`;return `<section class="messages" id="messages"><div class="intro"><button class="back-button" data-nav="dm-list">← All DMs</button><div class="intro-icon">●</div><h2>${esc(state.dmFriend?.name||state.dmFriend?.email||"Direct message")}</h2><p>Private messages are stored in the Orbit backend.</p></div>${state.dmMessages.length?state.dmMessages.map(m=>`<article class="message">${avatar(m.senderName||m.senderEmail)}<div class="message-body"><div class="message-meta"><strong>${esc(m.senderName||m.senderEmail||"Orbit user")}</strong><time>${new Date(m.createdAt).toLocaleString()}</time></div><p>${esc(m.body)}</p></div></article>`).join(""):`<div class="empty" style="min-height:210px"><div class="empty-inner"><h2>No messages yet</h2><p>Send the first private message.</p></div></div>`}</section><div class="composer-wrap"><form class="composer" id="dm-form"><input class="message-input" name="body" maxlength="4000" autocomplete="off" placeholder="Message ${esc(state.dmFriend?.name||"friend")}" required><button class="send" type="submit">↑</button></form><div class="helper">Private messages refresh automatically every five seconds.</div></div>`}
function renderFriendsBody(){return `<section class="messages"><div class="intro"><div class="intro-icon">♙</div><h2>Friends</h2><p>Manage real friend requests and open private conversations.</p><button class="primary add-friend-inline" data-add-friend>Add a friend</button></div><div class="request-section"><h3>Incoming requests <span>${state.incomingRequests.length}</span></h3>${state.incomingRequests.length?state.incomingRequests.map(requestRow).join(""):`<p class="muted-line">No incoming requests.</p>`}</div><div class="request-section"><h3>Accepted friends <span>${state.friends.length}</span></h3>${state.friends.length?state.friends.map(friend=>`<div class="dm-row-wrap"><button class="dm-row" data-dm="${friend.userId}">${avatar(friend.name||friend.email)}<span><strong>${esc(friend.name||friend.email||"Orbit user")}</strong><small>Start a DM</small></span><b>›</b></button><button class="call-friend" data-call-friend="${friend.userId}" data-kind="voice" title="Voice call">☎</button><button class="call-friend video-call" data-call-friend="${friend.userId}" data-kind="video" title="Video call">▣</button></div>`).join(""):`<p class="muted-line">No accepted friends yet.</p>`}</div><div class="request-section"><h3>Outgoing requests <span>${state.outgoingRequests.length}</span></h3>${state.outgoingRequests.length?state.outgoingRequests.map(friend=>`<div class="request-row">${avatar(friend.name||friend.email)}<span><strong>${esc(friend.name||friend.email||"Orbit user")}</strong><small>Pending</small></span></div>`).join(""):`<p class="muted-line">No outgoing requests.</p>`}</div></section>`}
function requestRow(request){return `<div class="request-row">${avatar(request.name||request.email)}<span><strong>${esc(request.name||request.email||"Orbit user")}</strong><small>Wants to be your friend</small></span><button class="accept" data-accept="${request.id}">Accept</button><button class="decline" data-decline="${request.id}">Decline</button></div>`}
function renderBottom(){return `<footer class="bottom"><div class="current-user">${avatar(state.user.username)}<div><strong>${esc(state.user.username)}</strong><small>Online</small></div></div><nav class="bottom-nav"><button class="${state.view==="dm"||state.view==="dm-list"?"active":""}" data-nav="dm-list">● DMs</button><button class="${state.view==="friends"?"active":""}" data-nav="friends">♙ Friends</button><button class="${state.view==="discover"?"active":""}" data-nav="discover">✦ Discover</button><button data-search>⌕ Search</button><button data-logout>Log out</button></nav></footer>`}
function bindAppEvents(){document.querySelectorAll("[data-community]").forEach(el=>el.onclick=()=>{state.view="server";state.activeCommunityId=Number(el.dataset.community);state.activeChannelId=null;loadHome()});document.querySelectorAll("[data-channel]").forEach(el=>el.onclick=()=>{state.view="server";state.activeChannelId=Number(el.dataset.channel);loadHome(state.activeChannelId)});document.querySelectorAll("[data-dm]").forEach(el=>el.onclick=()=>loadDm(Number(el.dataset.dm)));document.querySelectorAll("[data-group]").forEach(el=>el.onclick=()=>loadGroup(Number(el.dataset.group)));document.querySelectorAll("[data-nav]").forEach(el=>el.onclick=()=>{if(el.dataset.nav==="discover")return loadDiscover();state.view=el.dataset.nav;if(state.view==="dm-list")state.activeDmUserId=null;renderApp()});document.querySelectorAll("[data-create-community]").forEach(el=>el.onclick=showCommunityModal);document.querySelectorAll("[data-server-menu]").forEach(el=>el.addEventListener("click",showServerMenu));document.querySelectorAll("[data-create-channel]").forEach(el=>el.onclick=showChannelModal);document.querySelectorAll("[data-add-friend]").forEach(el=>el.onclick=showAddFriendModal);document.querySelectorAll("[data-create-group]").forEach(el=>el.onclick=showCreateGroupModal);document.querySelectorAll("[data-accept]").forEach(el=>el.onclick=()=>updateRequest(el.dataset.accept,"accept"));document.querySelectorAll("[data-decline]").forEach(el=>el.onclick=()=>updateRequest(el.dataset.decline,"decline"));document.querySelectorAll("[data-delete-message]").forEach(el=>el.onclick=()=>deleteOwnMessage(el.dataset.deleteMessage));document.querySelectorAll("[data-toggle-reaction]").forEach(el=>el.onclick=()=>toggleReaction(el.dataset.toggleReaction,el.dataset.emoji));document.querySelectorAll("[data-reaction]").forEach(el=>el.onclick=()=>showReactionPicker(el.dataset.reaction));document.querySelectorAll("[data-reply]").forEach(el=>el.onclick=()=>startReply(el.dataset.reply));document.querySelectorAll("[data-edit-message]").forEach(el=>el.onclick=()=>editOwnMessage(el.dataset.editMessage));document.querySelectorAll("[data-pin-message]").forEach(el=>el.onclick=()=>togglePinMessage(el.dataset.pinMessage));document.querySelectorAll("[data-vote-poll]").forEach(el=>el.onclick=()=>voteInPoll(el.dataset.votePoll,el.dataset.optionId));document.querySelector("[data-profile]")?.addEventListener("click",showProfileModal);document.querySelectorAll("[data-logout]").forEach(el=>el.onclick=logout);document.querySelector("[data-refresh]")?.addEventListener("click",()=>state.view==="dm"?loadDm(state.activeDmUserId):loadHome(state.activeChannelId));document.querySelector("[data-members]")?.addEventListener("click",showMembersModal);document.querySelector("[data-search]")?.addEventListener("click",showSearchModal);document.querySelector("[data-attach]")?.addEventListener("click",()=>document.querySelector("#attachment-input")?.click());document.querySelector("[data-create-poll]")?.addEventListener("click",showPollModal);document.querySelector("#message-form")?.addEventListener("submit",sendMessage);document.querySelector("#dm-form")?.addEventListener("submit",sendDm);document.querySelector("#group-form")?.addEventListener("submit",sendGroupMessage);document.querySelector("[data-home]")?.addEventListener("click",()=>{state.view="server";loadHome()});document.querySelector("[data-toggle-workspace]")?.addEventListener("click",()=>document.querySelector(".workspace")?.classList.toggle("mobile-open"));document.querySelectorAll("[data-join-call]").forEach(el=>el.addEventListener("click",()=>joinCall(Number(state.activeChannelId),el.dataset.kind||"voice")));document.querySelectorAll("[data-call-friend]").forEach(el=>el.addEventListener("click",()=>joinDirectCall(Number(el.dataset.callFriend),el.dataset.kind||"voice")));document.querySelectorAll("[data-join-public]").forEach(el=>el.addEventListener("click",()=>joinPublic(Number(el.dataset.joinPublic))));document.querySelectorAll("[data-share-community]").forEach(el=>el.addEventListener("click",()=>shareCommunity(Number(el.dataset.shareCommunity))));document.querySelector("[data-leave-call]")?.addEventListener("click",leaveCall);document.querySelector("[data-toggle-mic]")?.addEventListener("click",toggleMic);document.querySelector("[data-toggle-camera]")?.addEventListener("click",toggleCamera)}
async function fileToBase64(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(",")[1]||"");reader.onerror=reject;reader.readAsDataURL(file)})}
async function uploadAttachment(file){if(file.size>35*1024*1024)throw new Error("Attachments must be 35 MB or smaller");return api("/api/web/upload",{method:"POST",body:JSON.stringify({name:file.name,type:file.type||"application/octet-stream",data:await fileToBase64(file)})})}
async function sendMessage(event){event.preventDefault();const form=event.currentTarget;const body=new FormData(form).get("body");const file=document.querySelector("#attachment-input")?.files?.[0];if(!body&&!file||!state.activeChannelId)return;try{const attachment=file?await uploadAttachment(file):null;await api("/api/web/message",{method:"POST",body:JSON.stringify({channelId:state.activeChannelId,body,attachment,replyToId:state.replyToId})});state.replyToId=null;await loadHome(state.activeChannelId)}catch(err){showToast(err.message)}}
async function deleteOwnMessage(messageId){if(!confirm("Delete this message?"))return;try{await api("/api/web/moderation/delete-message",{method:"POST",body:JSON.stringify({messageId})});await loadHome(state.activeChannelId)}catch(err){showToast(err.message)}}
async function sendDm(event){event.preventDefault();const body=new FormData(event.currentTarget).get("body");if(!body||!state.activeDmUserId)return;try{await api("/api/web/dm",{method:"POST",body:JSON.stringify({friendId:state.activeDmUserId,body})});await loadDm(state.activeDmUserId)}catch(err){showToast(err.message)}}
async function sendCallSignal(recipientId,signalType,payload){await api("/api/web/call/signal",{method:"POST",body:JSON.stringify({channelId:state.call.channelId,recipientId,signalType,payload:JSON.stringify(payload)})})}
function mountLocalStream(){const video=document.querySelector("#local-video");if(video&&state.call.localStream)video.srcObject=state.call.localStream}
function mountRemoteStream(remoteId,stream){const holder=document.querySelector("#remote-media");if(!holder)return;let video=document.querySelector(`[data-remote="${remoteId}"]`);if(!video){video=document.createElement("video");video.dataset.remote=remoteId;video.autoplay=true;video.playsInline=true;holder.appendChild(video)}video.srcObject=stream}
async function createPeer(remoteId,initiator){if(state.call.peers.has(remoteId))return state.call.peers.get(remoteId);const pc=new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});state.call.localStream?.getTracks().forEach(track=>pc.addTrack(track,state.call.localStream));pc.onicecandidate=e=>{if(e.candidate)sendCallSignal(remoteId,"candidate",e.candidate).catch(()=>{})};pc.ontrack=e=>mountRemoteStream(remoteId,e.streams[0]);pc.onconnectionstatechange=()=>{if(["failed","closed","disconnected"].includes(pc.connectionState)){pc.close();state.call.peers.delete(remoteId)}};state.call.peers.set(remoteId,pc);if(initiator){const offer=await pc.createOffer();await pc.setLocalDescription(offer);await sendCallSignal(remoteId,"offer",offer)}return pc}
async function pollCall(){if(!state.call.joined)return;try{await api("/api/web/call/heartbeat",{method:"POST",body:JSON.stringify({channelId:state.call.channelId})});const result=await api(`/api/web/call/signals?channelId=${state.call.channelId}&afterId=${state.call.signalId}`);for(const signal of result.signals){state.call.signalId=Math.max(state.call.signalId,signal.id);const pc=await createPeer(signal.senderId,false);const payload=JSON.parse(signal.payload);if(signal.signalType==="offer"){await pc.setRemoteDescription(payload);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);await sendCallSignal(signal.senderId,"answer",answer)}else if(signal.signalType==="answer"){await pc.setRemoteDescription(payload)}else if(signal.signalType==="candidate"){try{await pc.addIceCandidate(payload)}catch{}}}for(const participant of result.participants){if(participant.id!==state.user.id&&!state.call.peers.has(participant.id)&&state.user.id<participant.id)await createPeer(participant.id,true)} }catch(err){console.warn("[Call] polling",err.message)}}
async function joinDirectCall(friendId,kind){state.activeDmUserId=friendId;await loadDm(friendId);const low=Math.min(Number(state.user.id),friendId);const high=Math.max(Number(state.user.id),friendId);await joinCall(-(low*1000000+high),kind)}
async function joinPublic(communityId){try{await api(`/api/web/community/${communityId}/join`,{method:"POST"});await loadHome();showToast("Joined public server")}catch(err){showToast(err.message)}}
async function shareCommunity(communityId){try{const result=await api(`/api/web/community/${communityId}/invite`,{method:"POST"});if(navigator.clipboard)await navigator.clipboard.writeText(result.link);showToast(`Invite copied: ${result.link}`)}catch(err){showToast(err.message)}}
async function joinCall(channelId,kind){try{if(!navigator.mediaDevices?.getUserMedia)throw new Error("Your browser does not support microphone or camera calls");const stream=await navigator.mediaDevices.getUserMedia({audio:true,video:kind==="video"});state.call={...state.call,joined:true,channelId,kind,localStream:stream,peers:new Map(),signalId:0};await api("/api/web/call/join",{method:"POST",body:JSON.stringify({channelId,kind})});state.view=channelId<0?"dm":"server";renderApp();mountLocalStream();clearInterval(state.call.pollTimer);state.call.pollTimer=setInterval(pollCall,1500);await pollCall()}catch(err){showToast(err.message)}}
async function leaveCall(){const channelId=state.call.channelId;clearInterval(state.call.pollTimer);state.call.peers.forEach(pc=>pc.close());state.call.localStream?.getTracks().forEach(track=>track.stop());if(channelId)await api("/api/web/call/leave",{method:"POST",body:JSON.stringify({channelId})}).catch(()=>{});state.call={joined:false,channelId:null,kind:null,localStream:null,peers:new Map(),signalId:0,pollTimer:null};renderApp()}
function toggleMic(){const track=state.call.localStream?.getAudioTracks()[0];if(track){track.enabled=!track.enabled;showToast(track.enabled?"Microphone on":"Microphone muted")}}
function toggleCamera(){const track=state.call.localStream?.getVideoTracks()[0];if(track){track.enabled=!track.enabled;showToast(track.enabled?"Camera on":"Camera off")}}
async function updateRequest(id,action){try{await api(`/api/web/friend/${id}/${action}`,{method:"POST"});await loadHome();state.view="friends";renderApp();showToast(action==="accept"?"Friend request accepted":"Friend request declined")}catch(err){showToast(err.message)}}
async function toggleReaction(messageId,emoji){try{await api("/api/web/reaction",{method:"POST",body:JSON.stringify({messageId,emoji})});await loadHome(state.activeChannelId)}catch(err){showToast(err.message)}}
function showReactionPicker(messageId){const node=modal(`<div class="modal-head"><h3>Add a reaction</h3><button class="modal-close">×</button></div><p>Choose a quick reaction.</p><div class="emoji-picker">${["👍","❤️","😂","🎉","🔥","👀"].map(emoji=>`<button data-pick-emoji="${emoji}">${emoji}</button>`).join("")}</div>`);node.querySelector(".modal-close").onclick=()=>node.remove();node.querySelectorAll("[data-pick-emoji]").forEach(button=>button.onclick=async()=>{await toggleReaction(messageId,button.dataset.pickEmoji);node.remove()})}
async function enableNotifications(){if(!("Notification" in window)){showToast("Browser notifications are not supported");return}const permission=Notification.permission==="default"?await Notification.requestPermission():Notification.permission;showToast(permission==="granted"?"Notifications enabled":permission==="denied"?"Notifications are blocked in browser settings":"Notifications not enabled")}
function showProfileModal(){const node=modal(`<div class="modal-head"><h3>Your profile</h3><button class="modal-close">×</button></div><div class="profile-preview">${avatar(state.user.username,state.user.avatarUrl)}<div><strong>${esc(state.user.username)}</strong><small>${esc(state.user.email||"")}</small></div></div><form id="profile-form"><label class="field"><span>DISPLAY NAME</span><input name="name" maxlength="80" value="${esc(state.user.name||state.user.username)}"></label><label class="field"><span>CUSTOM STATUS</span><input name="customStatus" maxlength="120" value="${esc(state.user.customStatus||"")}" placeholder="What are you doing?"></label><label class="field"><span>PRESENCE</span><select name="presence"><option value="online" ${state.user.presence==="online"?"selected":""}>Online</option><option value="idle" ${state.user.presence==="idle"?"selected":""}>Idle</option><option value="dnd" ${state.user.presence==="dnd"?"selected":""}>Do not disturb</option><option value="invisible" ${state.user.presence==="invisible"?"selected":""}>Invisible</option></select></label><label class="field"><span>AVATAR URL</span><input name="avatarUrl" value="${esc(state.user.avatarUrl||"")}" placeholder="https://…"></label><div id="profile-error" class="form-error"></div><button class="primary">Save profile</button></form>`);node.querySelector(".modal-close").onclick=()=>node.remove();node.querySelector("#profile-form").onsubmit=async event=>{event.preventDefault();const values=Object.fromEntries(new FormData(event.currentTarget).entries());try{const result=await api("/api/web/profile",{method:"PATCH",body:JSON.stringify(values)});state.user=result.user;node.remove();renderApp();showToast("Profile updated")}catch(err){node.querySelector("#profile-error").textContent=err.message}}}
function modal(inner){const node=document.createElement("div");node.className="modal-backdrop";node.innerHTML=`<section class="modal">${inner}</section>`;node.addEventListener("click",e=>{if(e.target===node)node.remove()});document.body.appendChild(node);return node}
function showCommunityModal(){const node=modal(`<div class="modal-head"><h3>Create a community</h3><button class="modal-close">×</button></div><p>This creates a real public community owned by your account. Every signed-in Orbit user can find it in Discover, and you can share an invite link too.</p><form id="community-form"><label class="field"><span>COMMUNITY NAME</span><input name="name" minlength="2" maxlength="120" autofocus required placeholder="My community"></label><button class="primary">Create community</button></form>`);node.querySelector(".modal-close").onclick=()=>node.remove();node.querySelector("#community-form").onsubmit=async e=>{e.preventDefault();try{await api("/api/web/community",{method:"POST",body:JSON.stringify({name:new FormData(e.currentTarget).get("name")})});node.remove();state.view="server";await loadHome()}catch(err){showToast(err.message)}}}
function showChannelModal(){const node=modal(`<div class="modal-head"><h3>Create a channel</h3><button class="modal-close">×</button></div><form id="channel-form"><label class="field"><span>CHANNEL NAME</span><input name="name" required placeholder="general"></label><label class="field"><span>TYPE</span><select name="kind" style="width:100%;background:var(--raised);color:var(--text);border:1px solid var(--border);padding:12px;border-radius:10px"><option value="text">Text</option><option value="voice">Voice</option></select></label><button class="primary">Create channel</button></form>`);node.querySelector(".modal-close").onclick=()=>node.remove();node.querySelector("#channel-form").onsubmit=async e=>{e.preventDefault();try{const form=new FormData(e.currentTarget);await api("/api/web/channel",{method:"POST",body:JSON.stringify({communityId:state.activeCommunityId,name:form.get("name"),kind:form.get("kind")})});node.remove();await loadHome()}catch(err){showToast(err.message)}}}
function showAddFriendModal(){const node=modal(`<div class="modal-head"><h3>Add a friend</h3><button class="modal-close">×</button></div><p>Enter their username, email, or account ID. They must accept before you can DM.</p><form id="friend-form"><label class="field"><span>USERNAME, EMAIL, OR ACCOUNT ID</span><input name="identifier" autofocus required placeholder="orbit_user"></label><div id="friend-error" class="form-error"></div><button class="primary">Send friend request</button></form>`);node.querySelector(".modal-close").onclick=()=>node.remove();node.querySelector("#friend-form").onsubmit=async e=>{e.preventDefault();try{await api("/api/web/friend",{method:"POST",body:JSON.stringify({identifier:new FormData(e.currentTarget).get("identifier")})});node.remove();await loadHome();state.view="friends";renderApp();showToast("Friend request sent")}catch(err){node.querySelector("#friend-error").textContent=err.message}}}
function showMembersModal(){const members=state.members.filter(m=>m.communityId===state.activeCommunityId);const currentRole=members.find(m=>m.userId===state.user.id)?.memberRole;const canModerate=["owner","admin","moderator"].includes(currentRole);const canManageRole=["owner","admin"].includes(currentRole);const node=modal(`<div class="modal-head"><h3>Real members</h3><button class="modal-close">×</button></div><p>${members.length} members returned from the backend. Owners and admins can assign server roles.</p>${members.map(m=>`<div class="message"><div>${avatar(m.name||m.email)}</div><div class="message-body"><div class="message-meta"><strong>${esc(m.name||m.email||"Orbit user")}</strong><time>${esc(m.memberRole)}</time>${canManageRole&&m.userId!==state.user.id&&m.memberRole!=="owner"?`<select class="member-role-select" data-member-role="${m.userId}"><option value="member" ${m.memberRole==="member"?"selected":""}>Member</option><option value="moderator" ${m.memberRole==="moderator"?"selected":""}>Moderator</option><option value="admin" ${m.memberRole==="admin"?"selected":""}>Admin</option></select>`:""}${canModerate&&m.userId!==state.user.id?`<button class="decline" data-ban="${m.userId}">Ban</button>`:""}</div></div></div>`).join("")||`<p>No members returned.</p>`}`);node.querySelector(".modal-close").onclick=()=>node.remove();node.querySelectorAll("[data-ban]").forEach(button=>button.onclick=()=>banFromCommunity(button.dataset.ban,node));node.querySelectorAll("[data-member-role]").forEach(select=>select.onchange=async()=>{try{await api(`/api/web/community/${state.activeCommunityId}/member-role`,{method:"POST",body:JSON.stringify({userId:Number(select.dataset.memberRole),role:select.value})});showToast("Role updated")}catch(err){showToast(err.message);await showMembersModal();node.remove()}})}
async function showServerMenu(){if(!state.activeCommunityId)return;try{const result=await api(`/api/web/community/${state.activeCommunityId}/overview`);state.serverOverview=result;const community=state.communities.find(c=>c.id===state.activeCommunityId);const settings=result.settings||{};const memberCount=state.members.filter(m=>m.communityId===state.activeCommunityId).length;const node=modal(`<div class="server-menu-modal"><div class="server-menu-hero"><div class="server-menu-icon">${esc(initials(community?.name||"Server").slice(0,2))}</div><div><h2>${esc(community?.name||"Server")}</h2><p>Community Server · <b>${memberCount} members</b></p></div><button class="modal-close">×</button></div><div class="server-menu-stats"><button data-menu-invite><span>♙</span><b>Invite</b></button><button data-menu-notifications><span>●</span><b>Notifications</b></button><button data-menu-settings><span>⚙</span><b>Settings</b></button><button data-menu-channels><span>#</span><b>Browse Channels</b></button></div><div class="server-menu-section"><button class="server-menu-row" data-menu-mark-read><span>Mark As Read</span><small>Clear unread indicators</small></button><button class="server-menu-row" data-menu-browse><span>Browse Channels <em>NEW</em></span><small>See all text and voice channels</small></button></div><div class="server-menu-section"><button class="server-menu-row" data-menu-create-channel><span>Create Channel</span><small>Add text or voice chat</small></button><button class="server-menu-row" data-menu-create-category><span>Create Category</span><small>Organize your channels</small></button><button class="server-menu-row" data-menu-create-event><span>Create Event</span><small>Schedule something for the community</small></button></div><div class="server-menu-section">${result.categories?.length?result.categories.map(category=>`<div class="server-menu-row"><span>▦ ${esc(category.name)}</span><small>Category</small></div>`).join(""):""}${result.events?.length?result.events.map(event=>`<div class="server-menu-row"><span>◷ ${esc(event.name)}</span><small>${new Date(event.startsAt).toLocaleString()}</small></div>`).join(""):""}<button class="server-menu-row" data-server-profile><span>Edit Profile</span><small>Update your display name and status</small></button><label class="server-toggle"><span>Show All Channels</span><input type="checkbox" data-setting="showAllChannels" ${settings.showAllChannels?"checked":""}></label><label class="server-toggle"><span>Hide Muted Channels</span><input type="checkbox" data-setting="hideMutedChannels" ${settings.hideMutedChannels?"checked":""}></label><label class="server-toggle"><span>Allow Direct Messages</span><input type="checkbox" data-setting="allowDirectMessages" ${settings.allowDirectMessages!==0?"checked":""}></label></div><div class="server-menu-footer">${settings.boosts||0} boosts · ${result.events?.length||0} upcoming events</div></div>`);node.querySelector(".modal-close").onclick=()=>node.remove();node.querySelector("[data-menu-invite]").onclick=async()=>{await shareCommunity(state.activeCommunityId);};node.querySelector("[data-menu-notifications]").onclick=enableNotifications;node.querySelector("[data-menu-settings]").onclick=()=>node.querySelector("[data-setting=allowDirectMessages]")?.scrollIntoView({behavior:"smooth"});node.querySelector("[data-menu-channels]").onclick=()=>{node.remove();document.querySelector(".workspace")?.classList.add("mobile-open")};node.querySelector("[data-menu-browse]").onclick=()=>{node.remove();document.querySelector(".workspace")?.classList.add("mobile-open")};node.querySelector("[data-menu-mark-read]").onclick=()=>showToast("Server marked as read");node.querySelector("[data-menu-create-channel]").onclick=()=>{node.remove();showChannelModal()};node.querySelector("[data-menu-create-category]").onclick=()=>{node.remove();showCategoryModal()};node.querySelector("[data-menu-create-event]").onclick=()=>{node.remove();showEventModal()};node.querySelector("[data-server-profile]").onclick=()=>{node.remove();showProfileModal()};node.querySelectorAll("[data-setting]").forEach(input=>input.onchange=async()=>{const values={showAllChannels:node.querySelector('[data-setting="showAllChannels"]').checked,hideMutedChannels:node.querySelector('[data-setting="hideMutedChannels"]').checked,allowDirectMessages:node.querySelector('[data-setting="allowDirectMessages"]').checked};try{state.serverOverview=await api(`/api/web/community/${state.activeCommunityId}/settings`,{method:"PATCH",body:JSON.stringify(values)});showToast("Server settings saved")}catch(err){showToast(err.message)}})}catch(err){showToast(err.message)}}
function showCategoryModal(){const node=modal(`<div class="modal-head"><h3>Create a category</h3><button class="modal-close">×</button></div><p>Group related text and voice channels together.</p><form id="category-form"><label class="field"><span>CATEGORY NAME</span><input name="name" maxlength="100" required placeholder="Community topics"></label><button class="primary">Create category</button></form>`);node.querySelector(".modal-close").onclick=()=>node.remove();node.querySelector("#category-form").onsubmit=async e=>{e.preventDefault();try{await api(`/api/web/community/${state.activeCommunityId}/category`,{method:"POST",body:JSON.stringify({name:new FormData(e.currentTarget).get("name")})});node.remove();showToast("Category created")}catch(err){showToast(err.message)}}}
function showEventModal(){const node=modal(`<div class="modal-head"><h3>Create an event</h3><button class="modal-close">×</button></div><p>Schedule a community event that members can see.</p><form id="event-form"><label class="field"><span>EVENT NAME</span><input name="name" maxlength="160" required placeholder="Community hangout"></label><label class="field"><span>DESCRIPTION</span><textarea name="description" maxlength="1000" placeholder="What is happening?"></textarea></label><label class="field"><span>STARTS</span><input name="startsAt" type="datetime-local" required></label><button class="primary">Create event</button></form>`);node.querySelector(".modal-close").onclick=()=>node.remove();node.querySelector("#event-form").onsubmit=async e=>{e.preventDefault();try{const form=new FormData(e.currentTarget);await api(`/api/web/community/${state.activeCommunityId}/event`,{method:"POST",body:JSON.stringify({name:form.get("name"),description:form.get("description"),startsAt:new Date(String(form.get("startsAt"))).toISOString()})});node.remove();showToast("Event created")}catch(err){showToast(err.message)}}}
async function handleInviteFromUrl(){const token=new URLSearchParams(location.search).get("invite");if(!token||!state.user)return;try{await api("/api/web/invite/join",{method:"POST",body:JSON.stringify({token})});history.replaceState({},"",location.pathname);await loadHome();showToast("Joined from invite link")}catch(err){showToast(err.message)}}
async function banFromCommunity(userId,node){const reason=window.prompt("Reason for ban (optional):")||"";try{await api("/api/web/moderation/ban",{method:"POST",body:JSON.stringify({communityId:state.activeCommunityId,userId,reason})});node.remove();await loadHome();showToast("Member banned")}catch(err){showToast(err.message)}}
function showSearchModal(){const node=modal(`<div class="modal-head"><h3>Search loaded messages</h3><button class="modal-close">×</button></div><label class="field"><span>SEARCH</span><input id="message-search" value="${esc(state.search)}" autofocus placeholder="Try a phrase"></label><button class="primary" id="apply-search">Search</button>`);node.querySelector(".modal-close").onclick=()=>node.remove();node.querySelector("#apply-search").onclick=()=>{state.search=node.querySelector("#message-search").value;node.remove();renderApp()}}
async function logout(){clearInterval(state.pollTimer);state.realtimeSource?.close();state.realtimeSource=null;await api("/api/web/auth/logout",{method:"POST"});state.user=null;renderAuth()}
boot();

function renderAttachment(message){const url=esc(assetUrl(message.attachmentUrl));const type=message.attachmentType||"";if(type.startsWith("image/"))return `<img class="message-media" src="${url}" alt="${esc(message.attachmentName||"Shared image")}" loading="lazy">`;if(type.startsWith("video/"))return `<video class="message-media" src="${url}" controls preload="metadata"></video>`;if(type.startsWith("audio/"))return `<audio class="message-audio" src="${url}" controls></audio>`;return `<a class="attachment" href="${url}" target="_blank" rel="noreferrer">▣ ${esc(message.attachmentName||"Download attachment")}</a>`}
function renderPoll(message){if(!message.poll)return "";return `<div class="poll-card"><strong>▣ ${esc(message.poll.question)}</strong>${message.poll.options.map(option=>`<button class="poll-option ${option.voted?"voted":""}" data-vote-poll="${message.poll.id}" data-option-id="${option.id}"><span>${esc(option.label)}</span><b>${option.votes}</b></button>`).join("")}</div>`}
function showPollModal(){const node=modal(`<div class="modal-head"><h3>Create a poll</h3><button class="modal-close">×</button></div><p>Ask a question and add two to eight choices.</p><form id="poll-form"><label class="field"><span>QUESTION</span><input name="question" maxlength="300" required autofocus placeholder="Where should we hang out?"></label><label class="field"><span>OPTIONS</span><input name="option1" maxlength="160" required placeholder="Option one"><input name="option2" maxlength="160" required placeholder="Option two"><input name="option3" maxlength="160" placeholder="Option three"><input name="option4" maxlength="160" placeholder="Option four"></label><button class="primary">Post poll</button></form>`);node.querySelector(".modal-close").onclick=()=>node.remove();node.querySelector("#poll-form").onsubmit=async event=>{event.preventDefault();const form=new FormData(event.currentTarget);const options=[1,2,3,4].map(index=>String(form.get(`option${index}`)||"").trim()).filter(Boolean);try{await api("/api/web/poll",{method:"POST",body:JSON.stringify({channelId:state.activeChannelId,question:form.get("question"),options})});node.remove();await loadHome(state.activeChannelId)}catch(err){showToast(err.message)}}}
async function editOwnMessage(messageId){const message=state.messages.find(item=>item.id===Number(messageId));const body=window.prompt("Edit message",message?.body||"");if(body===null)return;try{await api(`/api/web/message/${messageId}`,{method:"PATCH",body:JSON.stringify({body})});await loadHome(state.activeChannelId)}catch(err){showToast(err.message)}}
async function togglePinMessage(messageId){try{const result=await api(`/api/web/message/${messageId}/pin`,{method:"POST"});showToast(result.pinned?"Message pinned":"Message unpinned");await loadHome(state.activeChannelId)}catch(err){showToast(err.message)}}
async function voteInPoll(pollId,optionId){try{await api(`/api/web/poll/${pollId}/vote`,{method:"POST",body:JSON.stringify({optionId})});await loadHome(state.activeChannelId)}catch(err){showToast(err.message)}}
function startReply(messageId){state.replyToId=Number(messageId);const input=document.querySelector(".message-input");if(input){input.placeholder="Reply to message…";input.focus()}showToast("Reply mode enabled — send a message to reply")}

function renderGroupBody(){return `<section class="messages" id="messages"><div class="intro"><button class="back-button" data-nav="dm-list">← All DMs</button><div class="intro-icon">◉</div><h2>${esc(state.group?.name||"Group DM")}</h2><p>${state.group?.members?.length||0} members · private group conversation</p></div>${state.groupMessages.length?state.groupMessages.map(m=>`<article class="message">${avatar(m.senderName||m.senderEmail,m.senderAvatarUrl)}<div class="message-body"><div class="message-meta"><strong>${esc(m.senderName||m.senderEmail||"Orbit user")}</strong><time>${new Date(m.createdAt).toLocaleString()}</time></div><p>${esc(m.body)}</p></div></article>`).join(""):`<div class="empty" style="min-height:210px"><div class="empty-inner"><h2>No group messages yet</h2><p>Send the first message to this group.</p></div></div>`}</section><div class="composer-wrap"><form class="composer" id="group-form"><input class="message-input" name="body" maxlength="4000" autocomplete="off" placeholder="Message ${esc(state.group?.name||"group")}" required><button class="send" type="submit">↑</button></form><div class="helper">Group DMs support up to 20 accepted friends.</div></div>`}
function showCreateGroupModal(){const node=modal(`<div class="modal-head"><h3>New group DM</h3><button class="modal-close">×</button></div><p>Choose accepted friends to start a private group conversation.</p><form id="group-form-modal"><label class="field"><span>GROUP NAME</span><input name="name" maxlength="120" required placeholder="Weekend crew"></label><div class="field"><span>MEMBERS</span>${state.friends.map(friend=>`<label class="server-toggle"><span>${esc(friend.name||friend.email||"Orbit user")}</span><input type="checkbox" name="friendId" value="${friend.userId}"></label>`).join("")||`<p>Add and accept a friend first.</p>`}</div><div id="group-error" class="form-error"></div><button class="primary" ${state.friends.length?"":"disabled"}>Create group</button></form>`);node.querySelector(".modal-close").onclick=()=>node.remove();node.querySelector("#group-form-modal").onsubmit=async event=>{event.preventDefault();const form=new FormData(event.currentTarget);const friendIds=form.getAll("friendId").map(Number);try{const result=await api("/api/web/groups",{method:"POST",body:JSON.stringify({name:form.get("name"),friendIds})});node.remove();await loadHome();await loadGroup(result.id)}catch(err){node.querySelector("#group-error").textContent=err.message}}}
async function sendGroupMessage(event){event.preventDefault();const body=new FormData(event.currentTarget).get("body");if(!body||!state.activeGroupId)return;try{await api(`/api/web/groups/${state.activeGroupId}/messages`,{method:"POST",body:JSON.stringify({body})});await loadGroup(state.activeGroupId)}catch(err){showToast(err.message)}}

</script>
